name: Validate catalog release
on:
  pull_request:
permissions:
  contents: read
jobs:
  release-version:
    if: github.head_ref == 'codex/catalog-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: catalog-main
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: catalog-release
          persist-credentials: false
      - name: Validate version bumps and unchanged catalog entries using trusted code
        run: python3 catalog-main/scripts/catalog-release.py validate catalog-main catalog-release
