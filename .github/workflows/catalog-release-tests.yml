name: Test catalog release tooling
on:
  pull_request:
    paths:
      - 'scripts/*release*.py'
      - '.github/workflows/catalog-release*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/test-catalog-release.py
